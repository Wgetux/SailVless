<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.sailvless.Tun"/>
    <allow send_destination="org.sailvless.Tun"/>
  </policy>
  <!-- only the device user may start/stop the tunnel -->
  <policy user="defaultuser">
    <allow send_destination="org.sailvless.Tun" send_interface="org.sailvless.Tun1"/>
    <allow send_destination="org.sailvless.Tun" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_sender="org.sailvless.Tun"/>
  </policy>
  <policy context="default">
    <deny own="org.sailvless.Tun"/>
    <deny send_destination="org.sailvless.Tun"/>
  </policy>
</busconfig>
